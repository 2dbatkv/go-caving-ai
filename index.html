<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gocaving.ai</title>
<meta name="description" content="gocaving.ai is being rebuilt.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #DCE0D9;
    --paper-deep: #CDD3CB;
    --ink: #1C231E;
    --mid: #5F6B60;
    --water: #1F5A72;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans Condensed", "Segoe UI", system-ui, sans-serif;
    font-weight: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  /* faint survey grid, like notebook paper */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--paper-deep) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-deep) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: .55;
    pointer-events: none;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 46rem;
  }

  .plot { width: 100%; height: auto; display: block; margin-bottom: 2.5rem; overflow: visible; }

  .line { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .line--branch { stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--water); stroke-width: 2; stroke-dasharray: 6 7; stroke-linecap: round; }
  .station { fill: var(--ink); }
  .station--end { fill: var(--paper); stroke: var(--water); stroke-width: 2.5; }
  .mark {
    fill: var(--water);
    font-size: 15px;
    font-weight: 600;
    font-family: "IBM Plex Sans Condensed", sans-serif;
  }

  h1 {
    font-size: clamp(2.6rem, 9vw, 4.6rem);
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 0.95;
    margin: 0 0 1.25rem;
  }

  p {
    font-size: clamp(1.05rem, 2.4vw, 1.3rem);
    line-height: 1.55;
    max-width: 34ch;
    margin: 0 0 0.9rem;
    color: var(--mid);
  }

  footer {
    margin-top: 3.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--paper-deep);
    font-size: 0.9rem;
    color: var(--mid);
  }

  @media (prefers-reduced-motion: no-preference) {
    .draw {
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
      animation: draw 2.2s cubic-bezier(.5,.05,.35,1) forwards;
    }
    .line--branch { animation-delay: 1.1s; }
    .lead {
      opacity: 0;
      animation: appear .6s ease 2.3s forwards;
    }
    .station, .mark { opacity: 0; animation: appear .5s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes appear { to { opacity: 1; } }
  }
</style>
</head>
<body>
<main>
  <svg class="plot" viewBox="0 0 800 230" role="img" aria-label="A cave survey line plot ending in an unsurveyed lead.">
    <!-- main passage -->
    <polyline class="line draw" style="--len: 780; animation-delay: .2s"
      points="20,168 72,158 112,176 156,146 200,156 238,124 288,138 326,110 370,118 414,90 460,100 500,74 546,84 590,62 636,70 676,52 716,58"/>
    <!-- side lead, surveyed -->
    <polyline class="line line--branch draw" style="--len: 200"
      points="414,90 434,128 462,158 480,200"/>
    <!-- going lead, unsurveyed -->
    <path class="lead" d="M716,58 L768,42"/>

    <g class="station">
      <circle cx="20" cy="168" r="3.5" style="animation-delay: .3s"/>
      <circle cx="156" cy="146" r="3.5" style="animation-delay: .7s"/>
      <circle cx="288" cy="138" r="3.5" style="animation-delay: 1s"/>
      <circle cx="414" cy="90" r="3.5" style="animation-delay: 1.3s"/>
      <circle cx="546" cy="84" r="3.5" style="animation-delay: 1.7s"/>
      <circle cx="480" cy="200" r="3.5" style="animation-delay: 2s"/>
    </g>
    <circle class="station station--end" cx="716" cy="58" r="6" style="animation-delay: 2.2s"/>
    <text class="mark" x="778" y="38" style="animation-delay: 2.6s">?</text>
  </svg>

  <h1>Under construction</h1>
  <p>gocaving.ai is being rebuilt. The discussion series, recordings, and project tools will be back here.</p>

  <footer>Aaron Bird &middot; gocaving.ai</footer>
</main>
</body>
</html>
